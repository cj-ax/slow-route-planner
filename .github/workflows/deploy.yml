name: deploy
on:
  push:
    branches: [main, deer-scout]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: true }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Add pipeline data (if published)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p client/dist/data
          if gh release download data-latest -p deer-data.tar.gz -D /tmp 2>/dev/null; then
            tar -xzf /tmp/deer-data.tar.gz -C client/dist/data && ls -la client/dist/data
          else
            echo "no pipeline data release yet"
          fi
      - name: Pipeline tests
        run: |
          pip install -q -r pipeline/requirements.txt
          cd pipeline && ruff check . && python -m pytest -q
      - uses: actions/upload-pages-artifact@v3
        with: { path: client/dist }
  deploy:
    # The github-pages environment only accepts main by default. Running this
    # manually on another branch works once that branch is allowed in
    # Settings > Environments > github-pages.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - id: d
        uses: actions/deploy-pages@v4
