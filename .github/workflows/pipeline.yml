name: pipeline
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot (3 properties), all, hd (high-detail DPA properties only), or ids:<id1>,<id2>"
        default: pilot
      shards:
        description: "number of parallel scoring jobs"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency: { group: pipeline, cancel-in-progress: false }
env:
  PYTHONPATH: pipeline
  MODE: ${{ inputs.mode || 'pilot' }}
  SHARDS: ${{ inputs.shards || '1' }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: npm ci
      - name: Export properties (same code as the app)
        run: npx vite-node pipeline/export_properties.ts -- pipeline/work/properties.geojson
      - run: pip install -r pipeline/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with: { path: pipeline/work/pbf, key: "osm-pbf-${{ steps.week.outputs.w }}", restore-keys: osm-pbf- }
      - name: Download OSM extracts (Geofabrik)
        run: |
          mkdir -p pipeline/work/pbf
          for s in minnesota wisconsin; do
            f=pipeline/work/pbf/$s-latest.osm.pbf
            [ -s "$f" ] && [ -n "$(find "$f" -mtime -7)" ] && continue
            curl -sSfL --retry 4 -o "$f" "https://download.geofabrik.de/north-america/us/$s-latest.osm.pbf" || rm -f "$f"
          done
          ls -la pipeline/work/pbf
      - name: Prepare OSM layers
        continue-on-error: true
        run: python -m deerscout.cli osm $(for f in pipeline/work/pbf/*.pbf; do echo --pbf $f; done)
      - name: High-detail properties (deer permit areas in config.yaml hd.dpas)
        run: python -m deerscout.cli hd-ids
      - name: Selection
        run: python -m deerscout.cli select --mode "${{ env.MODE }}" | tee pipeline/work/selection.tsv
      - id: m
        run: python -c "import json;n=int('${{ env.SHARDS }}');print('matrix='+json.dumps({'shard':list(range(n))}))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: |
            pipeline/work/properties.geojson
            pipeline/work/dnr_parking.geojson
            pipeline/work/selection.tsv
            pipeline/work/hd_ids.json
            pipeline/work/osm/osm.parquet
          retention-days: 7

  score:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: inputs, path: pipeline/work }
      - name: Restore per-shard work (resumable)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/work/props
            pipeline/work/cache
          key: "score-${{ env.MODE }}-${{ env.SHARDS }}-${{ matrix.shard }}-${{ hashFiles('pipeline/deerscout/**', 'pipeline/config.yaml') }}-${{ github.run_id }}"
          restore-keys: |
            score-${{ env.MODE }}-${{ env.SHARDS }}-${{ matrix.shard }}-${{ hashFiles('pipeline/deerscout/**', 'pipeline/config.yaml') }}-
            score-${{ env.MODE }}-${{ env.SHARDS }}-${{ matrix.shard }}-
      - name: Score properties
        run: python -m deerscout.cli process --mode "${{ env.MODE }}" --shard ${{ matrix.shard }} --of ${{ env.SHARDS }} --max-minutes 270
      - run: df -h / && du -sh pipeline/work/props pipeline/work/cache || true
      - uses: actions/upload-artifact@v4
        with:
          name: props-${{ matrix.shard }}
          path: |
            pipeline/work/props/*.json
            pipeline/work/props/*.npz
          retention-days: 7

  merge:
    needs: score
    if: always() && needs.score.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: inputs, path: pipeline/work }
      - uses: actions/download-artifact@v4
        with: { pattern: "props-*", path: pipeline/work/props, merge-multiple: true }
      - run: python -m deerscout.cli merge --out pipeline/out
      - run: ls -la pipeline/out && du -sh pipeline/out && cat pipeline/out/meta.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish data release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tar -czf deer-data.tar.gz -C pipeline/out .
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Deer Scout data" --notes "Pipeline output, replaced on each run." --latest=false
          gh release upload data-latest deer-data.tar.gz --clobber
          gh release edit data-latest --notes "Pipeline run ${{ github.run_id }} (mode ${{ env.MODE }}), $(date -u +%FT%TZ)"
      - name: Redeploy site with new data
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --ref main
